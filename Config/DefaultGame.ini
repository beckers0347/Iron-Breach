[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=D3CEA1764F07D43AB159AC9B9584ADAB
ProjectName=First Person BP Game Template

[ConsoleVariables]
CommonUI.CheckKeyboardFocusAndParentage=1
CommonUI.DisallowUserFocusedWidgetForPendingFocusRecipient=1
CommonUI.FallbackToDesiredOnAutoRestoreFailure=1

; ---- Iron Breach UI: menu screen registry (MENUS_UI_WIRING §4) ----
; Order = Q/E cycle order. System has no hotkeys on purpose: in-menu, Escape
; is the universal close; in-game the controller's IA opens it.
[/Script/IronBreach.IBUISettings]
+Screens=(ScreenId="Inventory",TabLabel="Inventory",WidgetClass=/Game/IronBreach/UI/WBP_InventoryScreen.WBP_InventoryScreen_C,Hotkeys=(I,Tab))
+Screens=(ScreenId="Ledger",TabLabel="Ledger",WidgetClass=/Game/IronBreach/UI/WBP_LedgerScreen.WBP_LedgerScreen_C,Hotkeys=(L))
+Screens=(ScreenId="Map",TabLabel="Map",WidgetClass=/Game/IronBreach/UI/WBP_MapScreen.WBP_MapScreen_C,Hotkeys=(M))
; Squad tab: friends + party, pure C++ screen (also opened by the lobby strip's FRIENDS chip).
+Screens=(ScreenId="Squad",TabLabel="Squad",WidgetClass=/Script/IronBreach.IBFriendsScreen,Hotkeys=(F))
; Escape layer (not tabs): System opens on Escape, Settings lives inside it.
; Both are hidden from the tab banner and skipped by Q/E cycling.
+Screens=(ScreenId="System",TabLabel="System",WidgetClass=/Game/IronBreach/UI/WBP_SystemScreen.WBP_SystemScreen_C,Hotkeys=(),bShowInTabBar=False)
+Screens=(ScreenId="Settings",TabLabel="Settings",WidgetClass=/Script/IronBreach.IBSettingsScreen,Hotkeys=(),bShowInTabBar=False)

; ---- Cook everything under /Game/IronBreach: loot tables and item DAs are
; reached by runtime LoadObject fallbacks (kaiju/enemy loot floor), which the
; cooker's reference walk can't see. ----
[/Script/UnrealEd.ProjectPackagingSettings]
+DirectoriesToAlwaysCook=(Path="/Game/IronBreach")

; ---- Asset Manager scan rows (MENUS_UI_WIRING §2): Ledger catalog + map zones ----
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="IBItem",AssetBaseClass="/Script/IronBreach.IBItemDefinition",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/IronBreach/Items")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="IBMapZone",AssetBaseClass="/Script/IronBreach.IBMapZoneData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/IronBreach/Maps")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
