+Screens=(ScreenId="Ledger",TabLabel="Ledger",WidgetClass=/Game/IronBreach/UI/WBP_LedgerScreen.WBP_LedgerScreen_C,Hotkeys=(L))
+Screens=(ScreenId="Map",TabLabel="Map",WidgetClass=/Game/IronBreach/UI/WBP_MapScreen.WBP_MapScreen_C,Hotkeys=(M))
+Screens=(ScreenId="System",TabLabel="System",WidgetClass=/Game/IronBreach/UI/WBP_SystemScreen.WBP_SystemScreen_C,Hotkeys=())
; Settings is pure C++ (no WBP needed) — reached from System/main menu, no hotkey.
+Screens=(ScreenId="Settings",TabLabel="Settings",WidgetClass=/Script/IronBreach.IBSettingsScreen,Hotkeys=())

